<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: naimage-asset:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
    <title>naimage Agent</title>
    <link rel="stylesheet" href="./agent-window.css" />
  </head>
  <body>
    <div class="agent-shell">
      <header class="agent-header">
        <div class="agent-title">
          <strong>Agent</strong>
          <span id="project-name">正在连接主窗口…</span>
        </div>
        <div class="agent-header-actions">
          <select id="conversation-select" aria-label="会话历史" title="切换会话"></select>
          <button id="new-conversation" type="button" title="新建会话">新建</button>
          <button id="clear-conversation" type="button" title="清理当前聊天">清理</button>
        </div>
      </header>

      <section class="agent-status" aria-live="polite">
        <span id="status-dot"></span>
        <strong id="status-text">等待主窗口状态</strong>
        <small id="model-name"></small>
      </section>

      <section id="agent-goal-controls" class="agent-goal-controls" aria-label="Agent 任务模式">
        <div id="task-mode-row" class="task-mode-row">
          <div class="task-mode-switch" role="group" aria-label="Agent 任务模式">
            <button id="standard-mode" class="active" type="button" aria-pressed="true">普通</button>
            <button id="goal-mode" type="button" aria-pressed="false">Goal</button>
          </div>
          <span id="goal-availability">正在读取画布 Goal 范围</span>
        </div>
        <div id="goal-summary" class="goal-summary" hidden>
          <div class="goal-summary-heading">
            <strong id="goal-summary-title">全部图片容器</strong>
            <span id="goal-counts"></span>
            <code id="goal-hash"></code>
          </div>
          <div class="goal-metrics">
            <span id="goal-probe"></span>
            <span id="goal-cost"></span>
          </div>
          <p id="goal-warning"></p>
        </div>
      </section>

      <section id="agent-feed" class="agent-feed" aria-label="Agent 对话"></section>

      <section class="agent-context" aria-label="当前图片上下文">
        <button id="edit-sources" type="button">原图 <span id="source-count">0</span></button>
        <button id="edit-references" type="button">参考图 <span id="reference-count">0</span></button>
        <button id="edit-memory" type="button">记忆</button>
        <span class="selected-count">画布已选 <b id="selected-count">0</b></span>
      </section>

      <form id="agent-composer" class="agent-composer">
        <textarea id="agent-prompt" rows="5" placeholder="告诉 Agent 你想完成什么…" aria-label="Agent 指令"></textarea>
        <label id="steer-mode-field" class="steer-mode-field" hidden>
          <span>本次 TaskScope</span>
          <select id="steer-mode" aria-label="运行中素材修改方式">
            <option value="auto">自动：选中替换 SOURCE，参考图追加</option>
            <option value="keep">仅修改文字，保留 SOURCE / REFERENCE</option>
            <option value="replace-source">替换 SOURCE</option>
            <option value="merge-source">追加 SOURCE</option>
            <option value="replace-reference">替换 REFERENCE</option>
            <option value="merge-reference">追加 REFERENCE</option>
            <option value="clear-attachments">清空 SOURCE / REFERENCE</option>
          </select>
        </label>
        <div id="goal-steer-lock" class="goal-steer-lock" hidden>
          <strong>Goal 范围已冻结</strong>
          <span>运行中只能修改文字，不会替换或追加 SOURCE / REFERENCE。</span>
        </div>
        <footer>
          <div class="dock-controls">
            <label for="dock-select">收回</label>
            <select id="dock-select" aria-label="将 Agent 收回主窗口">
              <option value="">选择位置</option>
              <option value="right">右侧</option>
              <option value="left">左侧</option>
              <option value="top">上方</option>
              <option value="bottom">下方</option>
              <option value="floating">应用内浮动</option>
            </select>
          </div>
          <span class="shortcut">Ctrl + Enter</span>
          <button id="pause-button" class="pause-button" type="button" hidden>暂停</button>
          <button id="stop-button" class="stop-button" type="button" hidden>结束</button>
          <button id="send-button" class="send-button" type="submit">发送</button>
        </footer>
      </form>
    </div>
    <script src="./agent-window-renderer.js"></script>
  </body>
</html>

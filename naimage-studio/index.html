<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/png" href="./naimage.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Legacy iiimage-asset URLs remain readable while old project snapshots migrate. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https://sparkapi.org; img-src 'self' data: blob: naimage-asset: iiimage-asset:; media-src 'self' blob: naimage-asset: iiimage-asset:; font-src 'self' data:;"
    />
    <title>SparkAI WorkSpace</title>
    <script vite-ignore src="./glass-theme-bootstrap.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --theme-canvas: #110c08;
        --theme-surface-solid: #1d1712;
        --theme-ink: #fff9f3;
        --theme-muted: #a18c79;
        --theme-line-strong: rgba(255, 255, 255, 0.18);
        --theme-accent: #ff9867;
        --glass-rgb: 54, 34, 22;
        --glass-alpha: 0.22;
        --glass-blur: 26px;
        --glass-saturation: 138%;
        --glass-highlight: 0.34;
        --glass-shadow: 0.4;
        --glass-radius: 14px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--theme-canvas);
      }

      #root {
        min-height: 100vh;
      }

      .boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--theme-ink);
        background:
          linear-gradient(120deg, rgba(var(--glass-rgb), 0.22), transparent 34%),
          linear-gradient(300deg, color-mix(in srgb, var(--theme-accent) 8%, transparent), transparent 38%),
          var(--theme-canvas);
      }

      .boot-shell-card {
        width: min(380px, calc(100vw - 48px));
        display: grid;
        gap: 12px;
        padding: 18px;
        border: 1px solid var(--theme-line-strong);
        border-radius: var(--glass-radius);
        background: rgba(var(--glass-rgb), var(--glass-alpha));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, var(--glass-highlight)),
          0 18px 45px rgba(0, 0, 0, var(--glass-shadow));
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation));
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation));
      }

      .boot-shell-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid var(--theme-line-strong);
        border-radius: 8px;
        color: var(--theme-accent);
      }

      .boot-shell h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.18;
      }

      .boot-shell p {
        margin: 0;
        color: var(--theme-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .boot-shell-line {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid var(--theme-line-strong);
        border-radius: 8px;
        color: var(--theme-accent);
        background: color-mix(in srgb, var(--theme-surface-solid) 58%, transparent);
        font-size: 12px;
      }

      .boot-shell-spin {
        width: 14px;
        height: 14px;
        border: 2px solid color-mix(in srgb, var(--theme-accent) 24%, transparent);
        border-top-color: var(--theme-accent);
        border-radius: 999px;
        animation: boot-spin 0.82s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="SparkAI WorkSpace 启动中">
        <section class="boot-shell-card">
          <div class="boot-shell-mark" aria-hidden="true">NA</div>
          <h1>SparkAI WorkSpace 正在启动</h1>
          <p>正在加载工作台界面与本地会话。</p>
          <div class="boot-shell-line">
            <span class="boot-shell-spin" aria-hidden="true"></span>
            准备桌面环境
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/renderer-bootstrap.ts"></script>
  </body>
</html>

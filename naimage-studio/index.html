<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/png" href="./naimage.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Legacy iiimage-asset URLs remain readable while old project snapshots migrate. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https://sparkapi.org; img-src 'self' data: blob: naimage-asset: iiimage-asset: https:; font-src 'self' data:;"
    />
    <title>naimage</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1513;
      }

      #root {
        min-height: 100vh;
      }

      .boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #edf6f2;
        background:
          linear-gradient(120deg, rgba(39, 208, 192, 0.055), transparent 34%),
          linear-gradient(300deg, rgba(130, 170, 255, 0.045), transparent 38%),
          #0e1513;
      }

      .boot-shell-card {
        width: min(380px, calc(100vw - 48px));
        display: grid;
        gap: 12px;
        padding: 18px;
        border: 1px solid rgba(236, 246, 241, 0.13);
        border-radius: 8px;
        background: rgba(24, 33, 31, 0.92);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      }

      .boot-shell-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(236, 246, 241, 0.16);
        border-radius: 8px;
        color: #27d0c0;
      }

      .boot-shell h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.18;
      }

      .boot-shell p {
        margin: 0;
        color: #a7b8b2;
        font-size: 12px;
        line-height: 1.5;
      }

      .boot-shell-line {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid rgba(236, 246, 241, 0.13);
        border-radius: 8px;
        color: #72eee2;
        background: rgba(32, 43, 40, 0.72);
        font-size: 12px;
      }

      .boot-shell-spin {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(114, 238, 226, 0.24);
        border-top-color: #72eee2;
        border-radius: 999px;
        animation: boot-spin 0.82s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="naimage 启动中">
        <section class="boot-shell-card">
          <div class="boot-shell-mark" aria-hidden="true">NA</div>
          <h1>naimage 正在启动</h1>
          <p>正在加载工作台界面与本地会话。</p>
          <div class="boot-shell-line">
            <span class="boot-shell-spin" aria-hidden="true"></span>
            准备桌面环境
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

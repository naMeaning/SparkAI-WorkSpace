services:
  sparkai-extension:
    build:
      context: ../..
      dockerfile: deploy/sparkai-extension/Dockerfile
    restart: unless-stopped
    environment:
      SPARKAI_EXTENSION_HOST: ${SPARKAI_EXTENSION_HOST:-0.0.0.0}
      SPARKAI_EXTENSION_PORT: ${SPARKAI_EXTENSION_PORT:-17910}
      SPARKAI_EXTENSION_DATA_DIR: ${SPARKAI_EXTENSION_DATA_DIR:-/data}
      SPARKAI_EXTENSION_ADMIN_TOKEN: ${SPARKAI_EXTENSION_ADMIN_TOKEN:?set SPARKAI_EXTENSION_ADMIN_TOKEN}
      SPARKAI_EXTENSION_HASH_SECRET: ${SPARKAI_EXTENSION_HASH_SECRET:?set SPARKAI_EXTENSION_HASH_SECRET}
      SPARKAI_NEW_API_UPSTREAM: ${SPARKAI_NEW_API_UPSTREAM:?set SPARKAI_NEW_API_UPSTREAM}
      SPARKAI_IMAGE_CONCURRENCY: ${SPARKAI_IMAGE_CONCURRENCY:-2}
      SPARKAI_IMAGE_TIMEOUT_MS: ${SPARKAI_IMAGE_TIMEOUT_MS:-600000}
      SPARKAI_MAX_REQUEST_BYTES: ${SPARKAI_MAX_REQUEST_BYTES:-2097152}
      SPARKAI_MAX_RESULT_BYTES: ${SPARKAI_MAX_RESULT_BYTES:-100663296}
      SPARKAI_TASK_RETENTION_HOURS: ${SPARKAI_TASK_RETENTION_HOURS:-24}
      SPARKAI_TRUST_PROXY: ${SPARKAI_TRUST_PROXY:-1}
    ports:
      - "127.0.0.1:17910:17910"
    volumes:
      - sparkai-extension-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:17910/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sparkai-extension-data:
